<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Регистрация - PathFinder</title>
        <link rel="stylesheet" href="/css/common.css">
        <link rel="stylesheet" href="/css/register.css">
    </head>
    <body>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="register-card">
                        <h2 class="text-center mb-4">Регистрация в PathFinder</h2>
                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Имя пользователя</label>
                                <input type="text" class="form-control" id="username" required 
                                    placeholder="Придумайте имя пользователя">
                            </div>
                            
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required 
                                    placeholder="Ваш email">
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="password" required 
                                    placeholder="Не менее 6 символов">
                            </div>
                            
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Подтвердите пароль</label>
                                <input type="password" class="form-control" id="confirmPassword" required 
                                    placeholder="Повторите пароль">
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 mb-3">Зарегистрироваться</button>
                            
                            <div class="text-center">
                                <a href="/login" class="text-decoration-none">Уже есть аккаунт? Войти</a>
                            </div>
                        </form>
                        <div id="alert" class="alert mt-3" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('registerForm');
        const alertDiv = document.getElementById('alert');
        
        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const formData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                showAlert('Пароли не совпадают!', 'danger');
                return;
            }
            
            const submitBtn = form.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Регистрация...';
            submitBtn.disabled = true;
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showAlert('Регистрация успешна! Переход на страницу входа...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showAlert(result.message || 'Ошибка регистрации', 'danger');
                }
            } catch (error) {
                showAlert('Ошибка соединения с сервером', 'danger');
                console.error('Error:', error);
            } finally {

                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });
        
        function showAlert(message, type) {
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.display = 'block';
            
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 5000);
        }
    });
</script>

    </body>
</html>
