<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта PathFinder</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    
    <!-- Ваши стили -->
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/map.css">
</head>

<body>
    <header>
        <div class="logo"></div>
        <nav>
            <a href="/" class="navlink">Главная</a>
            <a href="/map" class="navlinkactive">Карта</a>
            <a href="/routes" class="navlink">Маршруты</a>
            <a href="/profile" class="navlink">Профиль</a>
        </nav>
        <div class="auth-buttons">
            <a href="/login" class="btn-login">Войти</a>
            <a href="/register" class="btn-register">Регистрация</a>
        </div>
    </header>

    <div class="container">
        <!-- Кнопка назад и заголовок -->
        <button class="btnback" onclick="window.location.href='/'">← Вернуться на главную</button>
        <div class="pagetitel">Карта PathFinder</div>

        <!-- Панель пользователя -->
        <div class="usermanu">
            <button class="btnnotifications" onclick="showNotifications()">🔔 Уведомления</button>
            <button class="btnnotifications" onclick="window.location.href='/profile'">👤 Профиль</button>
            <button class="btnnotifications" onclick="showSettings()">⚙️ Настройки</button>
        </div>

        <div class="map-container">
            <div class="map-wrapper">
                <!-- Левая панель с управлением -->
                <div class="control-panel">
                    <section class="searchpanel">
                        <h3>🔍 Поиск точек интереса</h3>
                        
                        <div class="form-group">
                            <input type="text" 
                                   id="search-input" 
                                   class="searchinput" 
                                   placeholder="Введите название места, адрес или тег">
                        </div>
                        
                        <div class="radiuscontrol">
                            <label>📏 Радиус поиска: <span id="radius-value">1000 м</span></label>
                            <input type="range" 
                                   id="radius-slider" 
                                   class="radiusslider" 
                                   min="100" 
                                   max="1000" 
                                   value="1000" 
                                   step="100">
                        </div>
                        
                        <div class="categoryfilters">
                            <label>🏷️ Категории:</label>
                            <div class="filter-buttons">
                                <button class="filterbtn active" data-category="all">Все</button>
                                <button class="filterbtn" data-category="restaurant">🍽️ Рестораны</button>
                                <button class="filterbtn" data-category="cafe">☕ Кафе</button>
                                <button class="filterbtn" data-category="park">🌳 Парки</button>
                                <button class="filterbtn" data-category="museum">🏛️ Музеи</button>
                                <button class="filterbtn" data-category="shop">🛒 Магазины</button>
                            </div>
                        </div>
                        
                        <div class="map-controls">
                            <button id="search-btn" class="btnsearchprimary map-control-btn">🔎 Искать</button>
                            <button id="current-location-btn" class="btnsearchcurrent map-control-btn">📍 Мое местоположение</button>
                            <button id="clear-btn" class="btnclearsearch map-control-btn">🗑️ Очистить</button>
                        </div>
                    </section>
                    
                    <!-- Результаты поиска -->
                    <section class="panelresult">
                        <div class="panel-header">
                            <h3>📋 Результаты</h3>
                            <div class="panel-stats">
                                <span id="result-count" class="resultcount">0</span>
                                <button id="export-btn" class="btnexp" title="Экспортировать результаты">📤</button>
                            </div>
                        </div>
                        
                        <div class="loading" id="loading">Загрузка...</div>
                        
                        <div id="search-results" class="search-results">
                            <div class="result-item no-results">
                                <p>Введите запрос для поиска или используйте кнопку "Мое местоположение"</p>
                            </div>
                        </div>
                    </section>
                </div>
                
                <!-- Правая часть с картой -->
                <div class="main-map">
                    <div id="map"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <!-- JavaScript для карты -->
    <script>
        // ===== ИНИЦИАЛИЗАЦИЯ КАРТЫ =====
        // Координаты Новосибирска
        const NOVOSIBIRSK_CENTER = [54.9833, 82.8964];
        const DEFAULT_ZOOM = 12;
        
        // Инициализация карты с задержкой для гарантированной загрузки DOM
        let map, markers, currentLocationMarker, searchCircle;
        let currentCategory = 'all';
        let searchResults = [];
        let userLocation = null;

        // DOM элементы
        let searchInput, radiusSlider, radiusValue, searchBtn, currentLocationBtn;
        let clearBtn, exportBtn, resultCount, searchResultsDiv, loadingDiv;

        // Инициализация после загрузки страницы
        document.addEventListener('DOMContentLoaded', function() {
            // Инициализация карты
            initializeMap();
            
            // Инициализация DOM элементов
            initializeDOMElements();
            
            // Инициализация обработчиков событий
            initializeEventListeners();
            
            // Добавляем начальные точки
            addInitialPOIs();
        });

        function initializeMap() {
            map = L.map('map').setView(NOVOSIBIRSK_CENTER, DEFAULT_ZOOM);
            
            // Добавление слоя OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);
            
            // Инициализация группы маркеров
            markers = L.layerGroup().addTo(map);
        }

        function initializeDOMElements() {
            searchInput = document.getElementById('search-input');
            radiusSlider = document.getElementById('radius-slider');
            radiusValue = document.getElementById('radius-value');
            searchBtn = document.getElementById('search-btn');
            currentLocationBtn = document.getElementById('current-location-btn');
            clearBtn = document.getElementById('clear-btn');
            exportBtn = document.getElementById('export-btn');
            resultCount = document.getElementById('result-count');
            searchResultsDiv = document.getElementById('search-results');
            loadingDiv = document.getElementById('loading');
        }

        function initializeEventListeners() {
            // Обновление значения радиуса
            radiusSlider.addEventListener('input', function() {
                radiusValue.textContent = this.value + ' м';
            });

            // Поиск по нажатию Enter
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });

            // Кнопка поиска
            searchBtn.addEventListener('click', performSearch);

            // Кнопка "Мое местоположение"
            currentLocationBtn.addEventListener('click', getCurrentLocation);

            // Кнопка очистки
            clearBtn.addEventListener('click', clearSearch);

            // Кнопка экспорта
            exportBtn.addEventListener('click', exportResults);

            // Фильтры категорий
            document.querySelectorAll('.filterbtn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filterbtn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentCategory = this.dataset.category;
                    filterResultsByCategory();
                });
            });
        }

        // ===== ФУНКЦИИ ГЕОЛОКАЦИИ =====
        function getCurrentLocation() {
            if (!navigator.geolocation) {
                alert('Ваш браузер не поддерживает геолокацию');
                return;
            }
            
            loadingDiv.classList.add('active');
            
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    userLocation = { lat, lng };
                    
                    // Центрировать карту на местоположении
                    map.setView([lat, lng], 15);
                    
                    // Обновить маркер местоположения
                    updateCurrentLocationMarker(lat, lng);
                    
                    // Показать радиус поиска
                    updateSearchCircle(lat, lng, parseInt(radiusSlider.value));
                    
                    // Автоматически выполнить поиск в радиусе
                    performSearchAroundLocation(lat, lng);
                    
                    loadingDiv.classList.remove('active');
                },
                function(error) {
                    loadingDiv.classList.remove('active');
                    
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            alert('Доступ к геолокации запрещен. Разрешите доступ в настройках браузера.');
                            break;
                        case error.POSITION_UNAVAILABLE:
                            alert('Информация о местоположении недоступна.');
                            break;
                        case error.TIMEOUT:
                            alert('Время ожидания геолокации истекло.');
                            break;
                        default:
                            alert('Произошла неизвестная ошибка при получении местоположения.');
                    }
                },
                { 
                    enableHighAccuracy: true, 
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        function updateCurrentLocationMarker(lat, lng) {
            // Удаляем старый маркер если есть
            if (currentLocationMarker) {
                map.removeLayer(currentLocationMarker);
            }
            
            // Создаем кастомную иконку для текущего местоположения
            const locationIcon = L.divIcon({
                className: 'current-location-icon',
                html: '<div style="background: #667eea; width: 24px; height: 24px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(102, 126, 234, 0.8);"></div>',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
            
            currentLocationMarker = L.marker([lat, lng], { icon: locationIcon })
                .addTo(map)
                .bindPopup('📍 Ваше текущее местоположение')
                .openPopup();
        }

        function updateSearchCircle(lat, lng, radius) {
            if (searchCircle) {
                map.removeLayer(searchCircle);
            }
            
            searchCircle = L.circle([lat, lng], {
                color: '#667eea',
                fillColor: '#667eea',
                fillOpacity: 0.1,
                radius: radius
            }).addTo(map);
        }

        // ===== ФУНКЦИИ ПОИСКА =====
        function performSearch() {
            const query = searchInput.value.trim();
            if (!query && !userLocation) {
                alert('Введите поисковый запрос или используйте кнопку "Мое местоположение"');
                return;
            }
            
            loadingDiv.classList.add('active');
            
            if (query) {
                searchByText(query);
            } else if (userLocation) {
                performSearchAroundLocation(userLocation.lat, userLocation.lng);
            }
        }

        function searchByText(query) {
            // Демо данные для Новосибирска
            const demoPOIs = [
                { id: 1, name: 'Новосибирский театр оперы и балета', lat: 54.9961, lng: 82.8963, category: 'museum', 
                  description: 'Крупнейший театр России', rating: 4.8 },
                { id: 2, name: 'Парк «Берёзовая роща»', lat: 54.9876, lng: 82.9123, category: 'park', 
                  description: 'Живописный парк в центре города', rating: 4.5 },
                { id: 3, name: 'Ресторан «СибИрья»', lat: 55.0032, lng: 82.9341, category: 'restaurant', 
                  description: 'Сибирская кухня', rating: 4.7 },
                { id: 4, name: 'Кофейня «Маркони»', lat: 54.9789, lng: 82.8794, category: 'cafe', 
                  description: 'Итальянский кофе и десерты', rating: 4.6 },
                { id: 5, name: 'ТРЦ «Аура»', lat: 55.0123, lng: 82.9456, category: 'shop', 
                  description: 'Крупнейший торговый центр', rating: 4.4 }
            ];
            
            // Фильтрация по запросу
            const filtered = demoPOIs.filter(poi => 
                poi.name.toLowerCase().includes(query.toLowerCase()) ||
                poi.description.toLowerCase().includes(query.toLowerCase())
            );
            
            // Имитация задержки сети
            setTimeout(() => {
                displaySearchResults(filtered);
                addMarkersToMap(filtered);
                loadingDiv.classList.remove('active');
            }, 300);
        }

        function performSearchAroundLocation(lat, lng) {
            const radius = parseInt(radiusSlider.value);
            
            // Демо данные вокруг местоположения
            const demoPOIs = [
                { id: 11, name: 'Ближайший ресторан', lat: lat + 0.001, lng: lng + 0.001, category: 'restaurant', 
                  description: 'Ресторан поблизости', rating: 4.2, distance: '0.1 км' },
                { id: 12, name: 'Кафе рядом', lat: lat - 0.001, lng: lng, category: 'cafe', 
                  description: 'Уютное кафе', rating: 4.3, distance: '0.2 км' },
                { id: 13, name: 'Сквер', lat: lat, lng: lng + 0.002, category: 'park', 
                  description: 'Место для отдыха', rating: 4.0, distance: '0.3 км' },
                { id: 14, name: 'Магазин продуктов', lat: lat + 0.002, lng: lng - 0.001, category: 'shop', 
                  description: 'Продуктовый магазин', rating: 3.9, distance: '0.4 км' }
            ];
            
            setTimeout(() => {
                displaySearchResults(demoPOIs);
                addMarkersToMap(demoPOIs);
                loadingDiv.classList.remove('active');
            }, 300);
        }

        function displaySearchResults(results) {
            searchResults = results;
            updateResultsDisplay();
        }

        function updateResultsDisplay() {
            const filteredResults = filterResultsByCategory();
            
            if (filteredResults.length === 0) {
                searchResultsDiv.innerHTML = `
                    <div class="result-item no-results">
                        <p>Ничего не найдено. Попробуйте изменить поисковый запрос или категорию.</p>
                    </div>
                `;
                resultCount.textContent = '0';
                return;
            }
            
            let html = '';
            filteredResults.forEach(poi => {
                const categoryIcon = getCategoryIcon(poi.category);
                html += `
                    <div class="result-item" data-id="${poi.id}">
                        <h4>${poi.name}</h4>
                        <p>${poi.description}</p>
                        <div class="result-meta">
                            <span class="category-badge">
                                <span class="category-icon">${categoryIcon}</span>
                                ${poi.category}
                            </span>
                            <span class="rating">⭐ ${poi.rating || 4.5}</span>
                        </div>
                        <button class="show-on-map" onclick="centerMapOnPOI(${poi.lat}, ${poi.lng})">
                            Показать на карте
                        </button>
                    </div>
                `;
            });
            
            searchResultsDiv.innerHTML = html;
            resultCount.textContent = filteredResults.length.toString();
            
            // Добавляем обработчики клика на результат
            document.querySelectorAll('.result-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    if (!e.target.classList.contains('show-on-map')) {
                        const id = parseInt(this.dataset.id);
                        const poi = searchResults.find(p => p.id === id);
                        if (poi) {
                            centerMapOnPOI(poi.lat, poi.lng);
                            highlightMarker(poi);
                        }
                    }
                });
            });
        }

        function filterResultsByCategory() {
            if (currentCategory === 'all') {
                return searchResults;
            }
            const filtered = searchResults.filter(poi => poi.category === currentCategory);
            updateResultsDisplay();
            return filtered;
        }

        // ===== ФУНКЦИИ ДЛЯ КАРТЫ =====
        function addMarkersToMap(pois) {
            markers.clearLayers();
            
            pois.forEach(poi => {
                const icon = L.divIcon({
                    className: 'custom-marker',
                    html: getMarkerIcon(poi.category),
                    iconSize: [30, 30],
                    iconAnchor: [15, 30]
                });
                
                const marker = L.marker([poi.lat, poi.lng], { icon })
                    .addTo(markers)
                    .bindPopup(`
                        <div class="popup-content">
                            <h3>${poi.name}</h3>
                            <p>${poi.description}</p>
                            <div class="popup-meta">
                                <span class="popup-category">${getCategoryIcon(poi.category)} ${poi.category}</span>
                                <span class="popup-rating">⭐ ${poi.rating || 4.5}</span>
                            </div>
                        </div>
                    `)
                    .on('click', function() {
                        this.openPopup();
                    });
                
                marker.poiData = poi;
            });
            
            // Если есть точки, подогнать карту к ним
            if (pois.length > 0) {
                const bounds = markers.getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds, { padding: [50, 50] });
                }
            }
        }

        function addInitialPOIs() {
            const initialPOIs = [
                { id: 1, name: 'Новосибирский театр оперы и балета', lat: 54.9961, lng: 82.8963, category: 'museum', 
                  description: 'Крупнейший театр России', rating: 4.8 },
                { id: 2, name: 'Парк «Берёзовая роща»', lat: 54.9876, lng: 82.9123, category: 'park', 
                  description: 'Живописный парк в центре города', rating: 4.5 }
            ];
            
            addMarkersToMap(initialPOIs);
        }

        // ===== ГЛОБАЛЬНЫЕ ФУНКЦИИ =====
        window.centerMapOnPOI = function(lat, lng) {
            map.setView([lat, lng], 16);
            
            markers.eachLayer(function(layer) {
                if (layer instanceof L.Marker && layer.poiData) {
                    if (Math.abs(layer.poiData.lat - lat) < 0.0001 && 
                        Math.abs(layer.poiData.lng - lng) < 0.0001) {
                        layer.openPopup();
                    }
                }
            });
        }

        function highlightMarker(poi) {
            markers.eachLayer(function(layer) {
                if (layer instanceof L.Marker && layer.poiData && layer.poiData.id === poi.id) {
                    layer.setIcon(L.divIcon({
                        className: 'highlighted-marker',
                        html: getMarkerIcon(poi.category, true),
                        iconSize: [40, 40],
                        iconAnchor: [20, 40]
                    }));
                    
                    setTimeout(() => {
                        layer.setIcon(L.divIcon({
                            className: 'custom-marker',
                            html: getMarkerIcon(poi.category),
                            iconSize: [30, 30],
                            iconAnchor: [15, 30]
                        }));
                    }, 2000);
                }
            });
        }

        function clearSearch() {
            searchInput.value = '';
            markers.clearLayers();
            if (searchCircle) {
                map.removeLayer(searchCircle);
                searchCircle = null;
            }
            if (currentLocationMarker) {
                map.removeLayer(currentLocationMarker);
                currentLocationMarker = null;
            }
            searchResults = [];
            updateResultsDisplay();
            map.setView(NOVOSIBIRSK_CENTER, DEFAULT_ZOOM);
        }

        function exportResults() {
            if (searchResults.length === 0) {
                alert('Нет данных для экспорта');
                return;
            }
            
            const dataStr = JSON.stringify(searchResults, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'pathfinder_search_results.json';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====
        function getMarkerIcon(category, highlight = false) {
            const size = highlight ? '40px' : '30px';
            const color = highlight ? '#ff6b6b' : '#667eea';
            
            const icons = {
                restaurant: '🍽️',
                cafe: '☕',
                park: '🌳',
                museum: '🏛️',
                shop: '🛒'
            };
            
            const icon = icons[category] || '📍';
            
            return `<div style="
                background: ${color};
                width: ${size};
                height: ${size};
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-size: ${highlight ? '20px' : '16px'};
                border: 3px solid white;
                box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            ">${icon}</div>`;
        }

        function getCategoryIcon(category) {
            const icons = {
                restaurant: '🍽️',
                cafe: '☕',
                park: '🌳',
                museum: '🏛️',
                shop: '🛒'
            };
            return icons[category] || '📍';
        }

        // ===== УТИЛИТЫ =====
        function showNotifications() {
            alert('Уведомления\nВ этом разделе будут отображаться ваши уведомления и сообщения.');
        }

        function showSettings() {
            alert('Настройки\nЗдесь можно будет настроить параметры карты, уведомления и профиль.');
        }
    </script>
</body>
</html>
