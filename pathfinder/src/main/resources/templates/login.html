<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в аккаунт</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/login.css">    
</head>
<body>
    <header>
        <div class="logo"></div>
        <nav>
            <a href="/" class="navlink">Главная</a>
            <a href="/map" class="navlink">Карта</a>
            <a href="/routes" class="navlink">Маршруты</a>
            <a href="/profile" class="navlink">Профиль</a>
        </nav>
        <div class="auth-buttons">
            <a href="/login" class="btn-login">Войти</a>
            <a href="/register" class="btn-register">Регистрация</a>
        </div>
    </header>

    <main>
        <div class="auth-container">
            <h2 class="auth-title">Вход в аккаунт</h2>
            
            <form>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-input" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-submit">Войти</button>
            </form>
            
                <div class="auth-links">
                    <p>Нет аккаунта? <a href="/register" class="auth-link">Зарегистрируйтесь</a></p>
                    <a href="/" class="back-link">← Вернуться на главную</a>
                </div>
            </div>
        </main>
    
        <script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('form');
    
    form.addEventListener('submit', async function(event) {
        event.preventDefault(); // ОТМЕНА СТАНДАРТНОЙ ОТПРАВКИ
        
        // Получаем данные формы
        const formData = {
            username: document.querySelector('input[type="email"]').value,
            password: document.querySelector('input[type="password"]').value
        };
        
        console.log('Отправляю данные:', formData);
        
        try {
            // Отправляем запрос на сервер
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: formData.username,
                    password: formData.password
                })
            });
            
            console.log('Статус ответа:', response.status);
            
            const result = await response.json();
            console.log('Ответ сервера:', result);
            
            if (response.ok && result.token) {
                // Сохраняем токен
                localStorage.setItem('auth_token', result.token);
                alert('Вход успешен!');
                window.location.href = '/map';
            } else {
                alert('Ошибка: ' + (result.message || 'Неверные данные'));
            }
        } catch (error) {
            console.error('Ошибка:', error);
            alert('Ошибка соединения с сервером');
        }
    });
});
</script>

    </body>
</html>
